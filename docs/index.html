<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HomeFlix — watch now</title>
<meta name="description" content="A Netflix-style streaming app. Browse and watch a library of classic films instantly in your browser.">
<style>
  :root{
    --bg:#0b0b0f; --bg2:#141418; --red:#e50914; --text:#fff; --muted:#b3b3b3;
    --card:#1c1c22; --radius:6px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);
    font-family:"Netflix Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  img{display:block}

  /* ---------- NAV ---------- */
  .nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:24px;
    padding:16px 4vw;transition:background .3s;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent)}
  .nav.solid{background:var(--bg)}
  .logo{color:var(--red);font-weight:900;font-size:1.7rem;letter-spacing:-1px}
  .nav .links{display:flex;gap:18px;font-size:.9rem;color:var(--muted)}
  .nav .links a:hover{color:#fff}
  .nav .spacer{flex:1}
  .search{display:flex;align-items:center;background:rgba(0,0,0,.6);border:1px solid #333;border-radius:4px;
    padding:6px 10px;gap:8px}
  .search input{background:none;border:none;color:#fff;outline:none;width:150px;font-size:.9rem}
  .search svg{width:16px;height:16px;fill:#fff;flex:none}
  @media(max-width:640px){.nav .links{display:none}.search input{width:100px}}

  /* ---------- HERO ---------- */
  .hero{position:relative;height:82vh;min-height:520px;display:flex;align-items:flex-end;
    padding:0 4vw 8vh;overflow:hidden}
  .hero::after{content:"";position:absolute;inset:0;z-index:1;
    background:linear-gradient(90deg,rgba(11,11,15,.95) 0%,rgba(11,11,15,.5) 40%,transparent 70%),
               linear-gradient(0deg,var(--bg) 3%,transparent 40%)}
  .hero-bg{position:absolute;inset:0;background-size:cover;background-position:center 30%;filter:brightness(.7);
    transform:scale(1.05)}
  .hero-inner{position:relative;z-index:2;max-width:640px}
  .hero h1{font-size:clamp(2rem,5vw,4rem);font-weight:900;line-height:1.02;margin-bottom:14px;
    text-shadow:0 2px 12px rgba(0,0,0,.7)}
  .hero .meta{color:var(--muted);font-size:.95rem;margin-bottom:12px}
  .hero .meta .tag{color:#46d369;font-weight:700;margin-right:10px}
  .hero p{font-size:1.05rem;color:#e5e5e5;margin-bottom:22px;max-width:560px;
    text-shadow:0 1px 6px rgba(0,0,0,.8);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .hero .btns{display:flex;gap:12px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:9px;padding:11px 26px;border-radius:5px;font-weight:700;
    font-size:1.05rem;cursor:pointer;border:none;transition:opacity .2s}
  .btn:hover{opacity:.82}
  .btn.play{background:#fff;color:#000}
  .btn.info{background:rgba(109,109,110,.7);color:#fff}
  .btn svg{width:20px;height:20px}

  /* ---------- ROWS ---------- */
  .rows{position:relative;z-index:10;margin-top:-6vh;padding-bottom:60px}
  .row{margin:0 0 34px}
  .row h2{font-size:1.3rem;font-weight:700;margin:0 0 12px;padding:0 4vw}
  .track-wrap{position:relative}
  .track{display:flex;gap:8px;overflow-x:auto;padding:0 4vw 10px;scroll-behavior:smooth;scrollbar-width:none}
  .track::-webkit-scrollbar{display:none}
  .card{position:relative;flex:0 0 auto;width:220px;height:124px;border-radius:var(--radius);overflow:hidden;
    cursor:pointer;background:var(--card);transition:transform .25s,box-shadow .25s}
  .card img{width:100%;height:100%;object-fit:cover}
  .card .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
    padding:10px;font-weight:700;font-size:.95rem;
    background:linear-gradient(135deg,#3a1c1c,#1c1c22)}
  .card .cap{position:absolute;left:0;right:0;bottom:0;padding:20px 10px 8px;font-size:.85rem;font-weight:600;
    background:linear-gradient(0deg,rgba(0,0,0,.9),transparent);opacity:0;transition:opacity .25s}
  .card:hover{transform:scale(1.12);box-shadow:0 8px 24px rgba(0,0,0,.7);z-index:5}
  .card:hover .cap{opacity:1}
  .card .yr{color:var(--muted);font-weight:400}
  .arrow-btn{position:absolute;top:0;bottom:10px;width:4vw;z-index:6;border:none;cursor:pointer;color:#fff;
    background:rgba(0,0,0,.5);opacity:0;transition:opacity .2s;font-size:1.6rem}
  .track-wrap:hover .arrow-btn{opacity:1}
  .arrow-btn.l{left:0}.arrow-btn.r{right:0}
  @media(max-width:640px){.card{width:150px;height:90px}.arrow-btn{display:none}}

  /* ---------- SEARCH GRID ---------- */
  .grid-view{display:none;padding:100px 4vw 60px}
  .grid-view.active{display:block}
  .grid-view h2{margin-bottom:18px;font-weight:600;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
  .grid .card{width:100%;height:130px}

  /* ---------- PLAYER MODAL ---------- */
  .modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);display:none;
    align-items:center;justify-content:center;padding:2vw}
  .modal.open{display:flex}
  .player{width:min(1100px,96vw);background:#000;border-radius:8px;overflow:hidden;position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,.8)}
  .player video{width:100%;max-height:74vh;background:#000;display:block}
  .player .pinfo{padding:16px 22px 22px;background:var(--bg2)}
  .player .pinfo h3{font-size:1.4rem;margin-bottom:6px}
  .player .pinfo .m{color:#46d369;font-weight:700;font-size:.9rem;margin-bottom:8px}
  .player .pinfo p{color:var(--muted);font-size:.95rem;line-height:1.5}
  .closeX{position:absolute;top:12px;right:12px;z-index:5;width:40px;height:40px;border-radius:50%;
    background:rgba(0,0,0,.6);border:none;color:#fff;font-size:1.4rem;cursor:pointer;line-height:1}
  .closeX:hover{background:var(--red)}
  .pmsg{display:none;position:absolute;top:0;left:0;right:0;padding:14px;text-align:center;z-index:6;
    background:rgba(0,0,0,.88);color:#fff;font-size:.95rem;align-items:center;justify-content:center;gap:8px}
  .pmsg a{color:var(--red);text-decoration:underline}

  .loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:200}
  .loader .logo{font-size:2.4rem;animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .foot{padding:30px 4vw 50px;color:#777;font-size:.82rem;border-top:1px solid #222}
  .foot a{color:#999;text-decoration:underline}
</style>
</head>
<body>

<div class="loader" id="loader"><div class="logo">HOMEFLIX</div></div>

<nav class="nav" id="nav">
  <div class="logo">HOMEFLIX</div>
  <div class="links">
    <a href="#" onclick="showHome();return false">Home</a>
    <a href="about.html">Self-host</a>
  </div>
  <div class="spacer"></div>
  <div class="search">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    <input id="q" placeholder="Search titles" autocomplete="off">
  </div>
</nav>

<div id="home">
  <section class="hero" id="hero"></section>
  <div class="rows" id="rows"></div>
</div>

<div class="grid-view" id="gridView">
  <h2 id="gridTitle"></h2>
  <div class="grid" id="grid"></div>
</div>

<div class="modal" id="modal">
  <div class="player">
    <button class="closeX" onclick="closePlayer()">✕</button>
    <div class="pmsg" id="pMsg"></div>
    <video id="video" controls playsinline></video>
    <div class="pinfo"><h3 id="pTitle"></h3><div class="m" id="pMeta"></div><p id="pDesc"></p></div>
  </div>
</div>

<footer class="foot">
  HOMEFLIX streams a library of <b>public-domain & Creative-Commons films</b> — free and legal to watch.
  Want your own private library of <i>your</i> media? <a href="about.html">Self-host it with Jellyfin →</a>
</footer>

<script>
const SVG_PLAY='<svg viewBox="0 0 24 24" fill="black"><path d="M8 5v14l11-7z"/></svg>';
const SVG_INFO='<svg viewBox="0 0 24 24" fill="white"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/></svg>';
let DATA=[];

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function cardHTML(item,i){
  const t=esc(item.title);
  return `<div class="card" onclick="openById('${item.id}')">
    <img src="${esc(item.poster)}" alt="${t}" loading="lazy"
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <div class="fallback" style="display:none">${t}</div>
    <div class="cap">${t} <span class="yr">${esc(item.year)}</span></div>
  </div>`;
}

function render(){
  // group by row, preserve order
  const order=[]; const groups={};
  DATA.forEach(it=>{ if(!groups[it.row]){groups[it.row]=[];order.push(it.row);} groups[it.row].push(it); });

  // hero = a title with a decent description
  const feat=DATA.find(d=>d.desc&&d.desc.length>80)||DATA[0];
  document.getElementById('hero').innerHTML=`
    <div class="hero-bg" style="background-image:url('${esc(feat.poster)}')"></div>
    <div class="hero-inner">
      <h1>${esc(feat.title)}</h1>
      <div class="meta"><span class="tag">Featured</span> ${esc(feat.year)} · ${esc(feat.row)}</div>
      <p>${esc(feat.desc)}</p>
      <div class="btns">
        <button class="btn play" onclick="openById('${feat.id}')">${SVG_PLAY} Play</button>
        <button class="btn info" onclick="openById('${feat.id}')">${SVG_INFO} More Info</button>
      </div>
    </div>`;

  document.getElementById('rows').innerHTML=order.map((row,ri)=>`
    <div class="row">
      <h2>${esc(row)}</h2>
      <div class="track-wrap">
        <button class="arrow-btn l" onclick="scrollRow(${ri},-1)">‹</button>
        <div class="track" id="track${ri}">${groups[row].map(cardHTML).join('')}</div>
        <button class="arrow-btn r" onclick="scrollRow(${ri},1)">›</button>
      </div>
    </div>`).join('');
}

function scrollRow(i,dir){const t=document.getElementById('track'+i);t.scrollBy({left:dir*t.clientWidth*0.85,behavior:'smooth'});}

let CUR=null, retried=false;
function openById(id){
  const it=DATA.find(d=>d.id===id); if(!it)return;
  CUR=it; retried=false;
  document.getElementById('pTitle').textContent=it.title;
  document.getElementById('pMeta').textContent=`${it.year} · ${it.row}`;
  document.getElementById('pDesc').textContent=it.desc||'';
  document.getElementById('pMsg').style.display='none';
  const v=document.getElementById('video');
  v.src=it.video; v.load();
  document.getElementById('modal').classList.add('open');
  v.play().catch(()=>{});
  document.body.style.overflow='hidden';
}
// Archive.org occasionally 500s on a single CDN node — retry once, then offer a link.
document.getElementById('video').addEventListener('error',()=>{
  if(!CUR)return;
  const v=document.getElementById('video');
  if(!retried){retried=true;setTimeout(()=>{v.src=CUR.video;v.load();v.play().catch(()=>{});},900);return;}
  const msg=document.getElementById('pMsg');
  msg.style.display='flex';
  msg.innerHTML=`This title's server node is busy. `+
    `<a href="https://archive.org/details/${CUR.id}" target="_blank" rel="noopener">Open on Archive.org →</a>`;
});
function closePlayer(){
  const v=document.getElementById('video'); v.pause(); v.removeAttribute('src'); v.load();
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow='';
}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closePlayer();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePlayer();});

function showHome(){document.getElementById('gridView').classList.remove('active');
  document.getElementById('home').style.display='';document.getElementById('q').value='';}

document.getElementById('q').addEventListener('input',e=>{
  const term=e.target.value.trim().toLowerCase();
  const gv=document.getElementById('gridView'), home=document.getElementById('home');
  if(!term){showHome();return;}
  const hits=DATA.filter(d=>d.title.toLowerCase().includes(term));
  document.getElementById('gridTitle').textContent=hits.length?`Results for "${term}"`:`No titles match "${term}"`;
  document.getElementById('grid').innerHTML=hits.map(cardHTML).join('');
  home.style.display='none'; gv.classList.add('active');
});

window.addEventListener('scroll',()=>{document.getElementById('nav').classList.toggle('solid',scrollY>60);});

fetch('catalog.json').then(r=>r.json()).then(d=>{
  DATA=d; render(); document.getElementById('loader').style.display='none';
}).catch(err=>{
  document.getElementById('loader').innerHTML='<div style="text-align:center;color:#b3b3b3">'+
    '<div class="logo" style="color:#e50914">HOMEFLIX</div><p style="margin-top:12px">Could not load catalog.</p></div>';
});
</script>
</body>
</html>
